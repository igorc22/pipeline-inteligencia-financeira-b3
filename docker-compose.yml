# Dashboard em http://localhost:8501. Cada análise gasta créditos, como fora do Docker.
#   make docker-up   -> docker compose up --build -d   (a imagem como ela é)
#   make docker-dev  -> docker compose up --build --watch   (recarga ao salvar)
#   make docker-a2a  -> docker compose --profile a2a up --build -d a2a   (agente A2A em http://localhost:10001)
services:
  dashboard:
    build:
      context: .
      target: runtime
    image: pipeline-b3-dashboard
    # Só no localhost: o dashboard não tem login e cada análise gasta créditos
    ports:
      - "127.0.0.1:8501:8501"
    # Lido na hora de subir: o .env nunca entra na imagem
    env_file:
      - .env
    environment:
      # Fora do modo watch os arquivos não mudam, então ligado não custa nada
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
    restart: unless-stopped
    develop:
      watch:
        # Código: copiado para dentro do container, sem rebuild; o Streamlit recarrega a página
        - action: sync
          path: ./fluxo_financeiro
          target: /app/fluxo_financeiro
          ignore:
            - "**/__pycache__/"
        - action: sync
          path: ./dashboard
          target: /app/dashboard
          ignore:
            - "**/__pycache__/"
        # Dependências: refaz a imagem (só a camada do uv sync roda de novo)
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock

  # Agente A2A: a mesma imagem, com outro comando. Fica num perfil para o `docker compose up` comum
  # continuar subindo só o dashboard, sem exigir a rede externa.
  a2a:
    profiles: ["a2a"]
    build:
      context: .
      target: runtime
    image: pipeline-b3-dashboard
    command: ["uvicorn", "servidor_a2a.servidor:app", "--host", "0.0.0.0", "--port", "10001"]
    # Só no localhost: o servidor não tem login e cada análise gasta créditos. Quem cobra chave é o gateway
    ports:
      - "127.0.0.1:10001:10001"
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:10001/.well-known/agent-card.json', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Rede do ecossistema: é por ela que o gateway LiteLLM chega aqui, em http://pipeline-b3:10001.
    # O apelido não muda se o serviço for renomeado.
    networks:
      agentes-net:
        aliases:
          - pipeline-b3
    restart: unless-stopped

# Criada uma vez, fora dos composes, porque vários projetos entram nela: docker network create agentes-net
networks:
  agentes-net:
    external: true
