[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estudo-arquitetura-coordenador-langchain"
version = "0.1.0"
description = "Multi-agent financial intelligence pipeline using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain>=1.2.18",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.1.10",
    "newsapi-python>=0.2.7",
    "python-dotenv>=1.2.2",
    "streamlit>=1.66.1",
    "uvicorn>=0.34.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-socket>=0.8.1",
]

[tool.setuptools.packages.find]
include = ["fluxo_financeiro*", "api*", "dashboard*"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
markers = [
    "tenta_rede_de_proposito: o teste abre socket de propósito; o conftest não o reprova por isso",
]
