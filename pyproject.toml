[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estudo-arquitetura-coordenador-langchain"
version = "0.1.0"
description = "Multi-agent financial intelligence pipeline using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain>=1.2.18",
    "langchain-anthropic>=1.4.3",
    "langgraph>=1.1.10",
    "newsapi-python>=0.2.7",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.34.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["fluxo_financeiro*", "api*"]
