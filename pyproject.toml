[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estudo-arquitetura-coordenador-langchain"
version = "1.0.0"
description = "Multi-agent financial intelligence pipeline using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brapi>=1.13.0",
    "langchain>=1.2.18",
    "langchain-google-genai>=4.4.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.1.10",
    "newsapi-python>=0.2.7",
    "python-dotenv>=1.2.2",
    "streamlit>=1.66.1",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "deepeval==4.3.3",
    "pytest>=8.0",
    "pytest-socket>=0.8.1",
]
# Só para abrir e regerar os notebooks: fica fora das dependências do pacote.
notebooks = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.setuptools.packages.find]
include = ["fluxo_financeiro*", "api*", "dashboard*"]

[tool.pytest.ini_options]
addopts = "--disable-socket -m 'not eval' -p no:deepeval"
markers = [
    "tenta_rede_de_proposito: o teste abre socket de propósito; o conftest não o reprova por isso",
    "eval: usa LLM-juiz e rede; custa dinheiro e a nota varia entre execuções",
]
# Avisos de depreciação de dentro do LangGraph e do LangSmith, que o projeto não controla
filterwarnings = [
    "ignore:The default value of `allowed_objects`",
    "ignore:langsmith.wrappers._openai_agents is deprecated",
]
